# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway      # Uses Netlify Git Gateway + Identity for auth
  branch: main           # Branch that edits are committed to

# Where uploaded images/files are stored in the repo, and how they're served
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # Placeholder collection so we can confirm the CMS loads.
  # The real content schema will be built out in a later session.
  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown", required: false }
